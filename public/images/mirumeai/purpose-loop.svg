<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">人が直したラベルが AI を育て、次の下書きが良くなる循環</title>
  <desc id="d">写真を開くと AI が下書きを出し、人が直し、サーバーに保存し、継続学習で AI の新しい版ができて、また下書きに戻る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <g font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" fill="#1f2328">

    <!-- 入口: 写真を読み込む -->
    <rect x="60" y="22" width="150" height="32" rx="16" fill="#ffffff" stroke="#8c959f"/>
    <text x="135" y="43" font-size="13" text-anchor="middle">写真を読み込む</text>
    <line x1="135" y1="54" x2="135" y2="84" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- ① AI が下書き（緑） -->
    <rect x="60" y="86" width="340" height="100" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="80" y="120" font-size="16" font-weight="700">① AI が下書きを出す</text>
    <text x="80" y="144" font-size="12.5">写真を開くだけで、バックグラウンドで自動推論。</text>
    <text x="80" y="164" font-size="12.5">果実・枝の輪郭と、房ごとの順位を重ねて表示。</text>

    <!-- ② 人が直す（青） -->
    <rect x="560" y="86" width="340" height="100" rx="10" fill="#eaf3fb" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="580" y="120" font-size="16" font-weight="700">② 人が確認して直す</text>
    <text x="580" y="144" font-size="12.5">摘果は残す順の番号、剪定は「切」の印を、</text>
    <text x="580" y="164" font-size="12.5">付ける・動かす・消す。スマホ1台でも作業できる。</text>

    <!-- ③ サーバーに保存（灰） -->
    <rect x="560" y="296" width="340" height="100" rx="10" fill="#f1f3f5" stroke="#6e7781" stroke-width="1.5"/>
    <text x="580" y="330" font-size="16" font-weight="700">③ サーバーに保存</text>
    <text x="580" y="354" font-size="12.5">画像とラベルを、組織ごとに MySQL・S3 へ登録。</text>
    <text x="580" y="374" font-size="12.5">他の人が先に保存済みなら、並べて選ばせる。</text>

    <!-- ④ 継続学習（緑） -->
    <rect x="60" y="296" width="340" height="100" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="80" y="330" font-size="16" font-weight="700">④ 継続学習で AI を育てる</text>
    <text x="80" y="354" font-size="12.5">保存したラベルで、SageMaker や GPU PC が</text>
    <text x="80" y="374" font-size="12.5">再学習。組織ごとに版を持ち、前の版に戻せる。</text>

    <!-- 矢印とそのラベル -->
    <line x1="400" y1="136" x2="560" y2="136" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="480" y="126" font-size="12.5" text-anchor="middle">確認して直す</text>

    <line x1="730" y1="186" x2="730" y2="296" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="744" y="246" font-size="12.5">サーバーへ登録</text>

    <line x1="560" y1="346" x2="400" y2="346" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="480" y="336" font-size="12.5" text-anchor="middle">学習ジョブを投入</text>

    <line x1="230" y1="296" x2="230" y2="186" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="244" y="246" font-size="12.5">新しい版に切替</text>

    <!-- 中央のひとこと -->
    <text x="480" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#57606a">直した分だけ、</text>
    <text x="480" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#57606a">次の下書きが良くなる</text>

    <!-- 凡例（色が繰り返し意味を持つので置く） -->
    <rect x="60" y="428" width="14" height="14" rx="3" fill="#eaf6ee" stroke="#2e8b57"/>
    <text x="82" y="440" font-size="12">AI の処理</text>
    <rect x="180" y="428" width="14" height="14" rx="3" fill="#eaf3fb" stroke="#1f6fb2"/>
    <text x="202" y="440" font-size="12">人の操作</text>
    <rect x="300" y="428" width="14" height="14" rx="3" fill="#f1f3f5" stroke="#6e7781"/>
    <text x="322" y="440" font-size="12">サーバー</text>
  </g>
</svg>
